workflows:
  ios-release:
    name: iOS Release & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # Define APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.connectapp.co"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Set up .env
        script: |
          echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-AIzaSyB_u-JtPpqJLiWiId2JW74ETNwqdgVCbRQ}" > .env
          mkdir -p assets
          cp .env assets/.env
      - name: Clean and install CocoaPods dependencies
        script: |
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa and release
        script: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          VERSION_NAME=${VERSION_NAME:-1.1.32}
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')
          PUBSPEC_BUILD=${PUBSPEC_BUILD:-68}
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || true)
          echo "Latest TestFlight build number found: $LATEST_BUILD"
          echo "Pubspec build number: $PUBSPEC_BUILD"
          NEXT_BUILD=$PUBSPEC_BUILD
          if [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]] && [ "$LATEST_BUILD" -ge "$NEXT_BUILD" ]; then
            NEXT_BUILD=$((LATEST_BUILD + 1))
          fi
          # Safety floor
          if [ "$NEXT_BUILD" -le 90 ]; then
            NEXT_BUILD=91
          fi
          echo "Building iOS Release version $VERSION_NAME (Build $NEXT_BUILD)"
          
          # Update Xcode project build settings
          cd ios
          agvtool new-version -all "$NEXT_BUILD" || true
          agvtool new-marketing-version "$VERSION_NAME" || true
          cd ..
          
          # Force update Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" ios/Runner/Info.plist || true
          
          # Ensure Flutter xcconfigs have the exact build name & number without duplicates
          mkdir -p ios/Flutter
          sed -i '' '/FLUTTER_BUILD_NAME/d' ios/Flutter/Generated.xcconfig 2>/dev/null || true
          sed -i '' '/FLUTTER_BUILD_NUMBER/d' ios/Flutter/Generated.xcconfig 2>/dev/null || true
          echo "FLUTTER_BUILD_NAME=$VERSION_NAME" >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_BUILD_NUMBER=$NEXT_BUILD" >> ios/Flutter/Generated.xcconfig
          sed -i '' '/FLUTTER_BUILD_NAME/d' ios/Flutter/Release.xcconfig 2>/dev/null || true
          sed -i '' '/FLUTTER_BUILD_NUMBER/d' ios/Flutter/Release.xcconfig 2>/dev/null || true
          echo "FLUTTER_BUILD_NAME=$VERSION_NAME" >> ios/Flutter/Release.xcconfig
          echo "FLUTTER_BUILD_NUMBER=$NEXT_BUILD" >> ios/Flutter/Release.xcconfig
          
          # Compile IPA in Release mode
          flutter build ipa --release \
            --build-name="$VERSION_NAME" \
            --build-number="$NEXT_BUILD" \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
